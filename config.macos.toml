#:schema https://mise.jdx.dev/schema/mise.json

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[bootstrap.packages]
"brew:bash" = "latest"
"brew:fish" = "latest"
"brew-cask:arc" = "latest"
"brew-cask:bettercapture" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:deskpad" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:gimp" = "latest"
"brew-cask:heynote" = "latest"
"brew-cask:inkscape" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:mac-mouse-fix" = "latest"
"brew-cask:mitmproxy" = "latest"
"brew-cask:monitorcontrol" = "latest"
"brew-cask:opencode-desktop" = "latest"
"brew-cask:puremac" = "latest"
"brew-cask:temurin" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:zen" = "latest"
# todo: https://github.com/adileo/squirreldisk

[bootstrap.macos.launchd.agents.env]
program = "/bin/sh"
args = ["-c", '{{ mise_bin }} env -D | while IFS== read -r k v; do launchctl setenv "$k" "$v"; done']
run_at_load = true

[env]
CLAUDE_CODE_SHELL = "/opt/homebrew/bin/bash"
DOCKER_HOST = "unix://{{ env.HOME }}/.config/colima/default/docker.sock"
_.path = [
    "/opt/homebrew/bin",
    "/opt/homebrew/sbin",
]

[tools]
"github:ip7z/7zip" = { version = "latest", asset_pattern = "7z*-mac.tar.xz" }
"http:ssh-copy-id" = { version = "10.2p1", url = "https://raw.githubusercontent.com/openssh/openssh-portable/V_10_2_P1/contrib/ssh-copy-id" }
android-sdk = "latest"
"github:docker/docker-credential-helpers" = { version = "latest", matching = "osxkeychain-v", rename_exe = "docker-credential-osxkeychain" }

[bootstrap.hooks]
post-tools = "yes | mise x android-sdk -- sdkmanager platform-tools >/dev/null"
